# Operator-tunable defaults, committed. Secrets live in secerts.toml next to
# this file (NOT committed — machine-local). Every value here can be
# overridden by an environment variable, and every env value wins over these
# files. The frontend can in turn override the SFU URL at runtime (config
# settings -> LiveKit SFU URL); the recommended lookup order is therefore:
#
#   frontend user override  >  env var  >  secerts.toml  >  settings.toml
#
# The Studio keeps the raw WebRTC transport (main-server signalling + STUN) as
# the first fallback and the pure WebSocket transport (MP4 fallback) as the
# zero-external-services last resort: when the LiveKit SFU is unreachable the
# UI switches to WebRTC, then to WebSocket (/ws/stream/{request_id}).

[livekit]
# LiveKit SFU endpoint. Leave empty to disable the WebRTC live transport
# (the Studio then uses Wi-Fi-profile WebSocket/MP4 paths). ws:// for a local
# deployment (docker-compose.livekit.yml serves it on ws://127.0.0.1:7880),
# wss:// in production (LiveKit Cloud or a TLS-terminated host).
url = "wss://fast-float-hh34d0ns.livekit.cloud"

# Prefix for auto-generated room names ("float-<hex12>").
room_prefix = "float"

# Room-token lifetime for the browser, seconds (clamped 60..86400).
token_ttl_s = 3600

[webrtc]
# STUN for the raw WebRTC transport (main-server signalling + ICE).
# By default the API runs its own STUN binding responder on udp/3478 and
# advertises itself as `stun:<host-the-browser-used>:3478`, so no LiveKit
# coturn container and no public Google server are needed. Disable with
# WEBRTC_STUN=0, or change the port with WEBRTC_STUN_PORT.
stun_enabled = true
stun_port = 3478
# Public hostname/IP to advertise when the API sits behind a proxy/NAT.
# Empty = use the Host header of the request (usually correct).
stun_host = ""

# Explicit STUN list; when non-empty it wins over the built-in responder.
# Point this at the self-hosted coturn in docker-compose.livekit.yml, or at
# the main server's public host:
#   stun_urls = ["stun:<your-public-host>:3478"]
# Env override: WEBRTC_STUN_URLS="stun:a:3478,stun:b:3478".
# Empty = use the API's built-in responder (the default for this deployment).
stun_urls = []
