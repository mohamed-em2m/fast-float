# Operator-tunable defaults, committed. Secrets live in secerts.toml next to
# this file (NOT committed — machine-local). Every value here can be
# overridden by an environment variable, and every env value wins over these
# files. The frontend can in turn override the SFU URL at runtime (config
# settings -> LiveKit SFU URL); the recommended lookup order is therefore:
#
#   frontend user override  >  env var  >  secerts.toml  >  settings.toml
#
# The Studio keeps the raw WebRTC transport (main-server signalling + STUN) as
# the first fallback and the pure WebSocket transport (MP4 fallback) as the
# zero-external-services last resort: when the LiveKit SFU is unreachable the
# UI switches to WebRTC, then to WebSocket (/ws/stream/{request_id}).

[livekit]
# LiveKit SFU endpoint. Leave empty to disable the WebRTC live transport
# (the Studio then uses Wi-Fi-profile WebSocket/MP4 paths). ws:// for a local
# deployment (docker-compose.livekit.yml serves it on ws://127.0.0.1:7880),
# wss:// in production (LiveKit Cloud or a TLS-terminated host).
url = "wss://fast-float-hh34d0ns.livekit.cloud"

# Prefix for auto-generated room names ("float-<hex12>").
room_prefix = "float"

# Room-token lifetime for the browser, seconds (clamped 60..86400).
token_ttl_s = 3600

[webrtc]
# STUN for the raw WebRTC transport (main-server signalling + ICE).
# By default the API runs its own STUN binding responder on udp/3478 and
# advertises itself as `stun:<host-the-browser-used>:3478`, so no LiveKit
# coturn container and no public Google server are needed. Disable with
# WEBRTC_STUN=0, or change the port with WEBRTC_STUN_PORT.
stun_enabled = true
stun_port = 3478
# Public hostname/IP to advertise when the API sits behind a proxy/NAT.
# Empty = use the Host header of the request (usually correct).
stun_host = ""

# Explicit STUN list; when non-empty it wins over the built-in responder.
# Point this at the self-hosted coturn in docker-compose.livekit.yml, or at
# the main server's public host:
#   stun_urls = ["stun:<your-public-host>:3478"]
# Env override: WEBRTC_STUN_URLS="stun:a:3478,stun:b:3478".
# Empty = use the API's built-in responder (the default for this deployment).
stun_urls = []

# TURN relay for browsers that cannot reach this server over UDP (RunPod /
# Cloudflare / other TCP-only proxies, strict corporate NAT). STUN alone is
# enough on a LAN, but not through a TCP-only edge proxy.
# Supported schemes: turn:, turns:, turn:...?transport=tcp.
# Static credentials can live here; put real credentials in secerts.toml:
#   [webrtc]
#   turn_urls = ["turn:turn.example.com:3478?transport=tcp"]
#   turn_username = "..."
#   turn_credential = "..."
# For coturn `use-auth-secret`, set only turn_secret in secerts.toml; the API
# then returns short-lived credentials instead of the shared secret.
# Env overrides: WEBRTC_TURN_URLS, WEBRTC_TURN_USERNAME,
# WEBRTC_TURN_CREDENTIAL, WEBRTC_TURN_SECRET, WEBRTC_TURN_TTL_S.
turn_urls = []
turn_username = ""
turn_credential = ""
turn_secret = ""
turn_ttl_s = 3600

[gemini]
# Gemini Live voice agent (agents/ — a livekit-agents worker that runs the
# conversation with Gemini speech-to-speech and streams its TTS to the FLOAT
# avatar). These are the non-secret defaults; the API key does NOT go here.
# Put the key in secerts.toml instead:
#
#   [gemini]
#   api_key = "..."            # or export GOOGLE_API_KEY / GEMINI_API_KEY
#
# The worker (agents/float_agent) reads that same file when the environment
# variable is absent, so one key works for both processes.
#
# Env overrides (highest precedence): GOOGLE_API_KEY / GEMINI_API_KEY,
# GEMINI_MODEL, GEMINI_VOICE, GEMINI_LANGUAGE, GOOGLE_GENAI_USE_VERTEXAI,
# GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION, FLOAT_AVATAR_IDENTITY,
# FLOAT_GEMINI_AGENT_NAME, FLOAT_GEMINI_AUTODISPATCH.
#
# Leave model empty to use the plugin's current stable Gemini Live model.
model = "google/gemini-3.8-live"
voice = "Puck"
language = ""
# Vertex AI instead of the Gemini Developer API:
vertexai = false
project = ""
location = ""
# System prompt for the Gemini Live worker. This is the avatar's spoken
# persona; edit prompts/gemini_agent.md instead of the Python source.
# Relative paths are resolved against this config directory, the working
# directory, then the repository root.
instructions_file = "prompts/gemini_agent.md"
# Optional inline prompt; used only when instructions_file is empty/missing.
# instructions = """..."""
# Identities/settings the API uses when a Gemini session starts:
avatar_identity = "float-avatar"
agent_name = "float-gemini"
autodispatch = true

# =============================================================================
# FLOAT model + inference
# =============================================================================
# Everything the FLOAT pipeline used to read from CLI flags / env vars is here.
# The file wins; the old env vars (NGPUS, OPTIMIZATION_MODE, USE_FP16,
# RESULTS_DIR) are only fallbacks when a key is absent. The HTTP API and the
# LiveKit avatar read this same file, so both processes render identically.
#
# Architecture values are part of the checkpoint's shape. They MUST match
# checkpoints/float.pth; changing dim_*, fmt_depth, input_size, fps or
# wav2vec_sec makes the weights fail to load or produces the wrong motion.
# Tune sampling / decode / guidance instead.

[float]
# FLOAT renderer used by the live avatar (/livekit/conversation). The avatar
# must generate each 2 s chunk faster than the audio plays it; NFE is the main
# speed/quality knob. 5 = fastest, 10 = balanced, 25 = best quality.
# If the log says "[livekit-gen] slower than real time: RTF=1.2x", lower this.
# The file /generate path uses [float.request].nfe instead.
livekit_nfe = 5
# Audio buffer threshold (seconds) before launching the avatar's FIRST render chunk.
# Lower values (e.g. 0.4s) cut latency — the avatar starts moving almost immediately.
# Higher values (e.g. 5.0s) collect a longer utterance before the avatar begins
# responding (better sentence pacing). Range: 0.2..10 s.
livekit_first_chunk_sec = 5.0
# Ongoing chunk window (seconds) — how much audio to collect between render groups.
# FLOAT accepts the full window and automatically iterates its internal 2 s sub-windows
# with smooth seam blending across them:
#   2.0 = fire a render after every 2 s of audio (lowest latency).
#   5.0 = buffer 5 s of speech, then pass all 5 s directly to FLOAT in one render pass
#         for cohesive sentence pacing and better temporal continuity.
# Range: 2.0..10 s (values below 2 are clamped to 2 — the model's minimum window).
livekit_chunk_sec = 5.0
# Duration (seconds) of the pre-rendered silence/idle loop video generated once
# at session start (default 2.0s). Looped while the avatar is idle.
livekit_silence_sec = 10.0
# Maximum concurrent live avatar streams allowed to render in parallel on the GPU.
# 0 = auto-detect based on available GPU VRAM (recommended).
livekit_max_streams = 0

[float.checkpoint]
# Weights and output locations.
pretrained_dir = "./checkpoints"
ckpt_path = "./checkpoints/float.pth"
# Env fallback: RESULTS_DIR.
res_dir = "./results"

[float.runtime]
# Defaults for the process/model. A per-request value still wins.
seed = 15
# Reuse the same initial noise for every render (reproducible comparisons).
fix_noise_seed = false
# GPUs used for parallel decoding. Env fallback: NGPUS.
ngpus = 1
# none | torch_compile | channels_last | amp | cudnn_benchmark | all.
# Env fallback: OPTIMIZATION_MODE.
optimization_mode = "all"
# FP16 model weights. Env fallback: USE_FP16.
use_fp16 = true
# Time every stage (slower; useful for profiling).
benchmark = false
# FFmpeg NVENC | CPU PyAV | Torchcodec.
video_encoder = "FFmpeg NVENC"
# Default for direct/CLI inference. /generate uses [float.request].no_crop.
no_crop = false
# Frames decoded per GPU micro-batch. 0 = auto-size from free VRAM.
# Per-request decode_batch_size overrides this.
decode_batch_size = 0
# Run the eager/compiled decoder in channels_last (A/B per GPU; off by default).
# Env fallback: FLOAT_DECODE_CHANNELS_LAST.
decode_channels_last = false
# Decoder autocast: "off", "fp16" or "bf16". Off is the numerics-safe default.
# Env fallback: FLOAT_DECODE_AUTOCAST.
decode_autocast = "on"

[float.video]
# input_size is the model's working resolution (checkpoint-dependent).
input_size = 512
input_nc = 3
fps = 25.0

[float.audio]
sampling_rate = 16000
# Adjacent frames: for value v, t -> [t-v, ..., t, ..., t+v].
audio_marcing = 2
# Audio window length in seconds (50 frames at 25 fps).
wav2vec_sec = 2.0
# Attention window: 1 attends to t-1, t, t+1 for frame t.
attention_window = 2
only_last_features = false
average_emotion = false

[float.paths]
# Feature extractors / ONNX artifacts. The ONNX files are optional: a missing
# file falls back to the torch path.
wav2vec_model_path = "./checkpoints/wav2vec2-base-960h"
audio2emotion_path = "./checkpoints/wav2vec-english-speech-emotion-recognition"
emotion_onnx_path = "./onnx/emotion_v1.onnx"
wav2vec_onnx_path = "./onnx/wav2vec_v1.onnx"
fmt_onnx_path = "./onnx/fmt_step_v1.onnx"
# Optional inputs for the one-shot CLI; the API supplies these per request.
# Empty means "not set".
ref_path = ""
aud_path = ""
res_video_path = ""
emo = ""

[float.model]
# Architecture: keep these equal to the checkpoint.
style_dim = 512
dim_a = 512
dim_w = 512
dim_h = 1024
dim_m = 20
dim_e = 7
fmt_depth = 8
num_heads = 8
mlp_ratio = 4.0
no_learned_pe = false
num_prev_frames = 10
max_grad_norm = 1.0
# Dropout is a training knob; inference ignores it but it is kept here so the
# option set is complete.
audio_dropout_prob = 0.1
ref_dropout_prob = 0.1
emotion_dropout_prob = 0.1

[float.ode]
# Model/CLI sampling default. The live avatar uses livekit_nfe above and the
# HTTP API uses [float.request].nfe below.
nfe = 10
ode_atol = 1e-5
ode_rtol = 1e-5
torchdiffeq_ode_method = "euler"

[float.guidance]
# Classifier-free guidance (vector-field scales). Higher = stronger condition.
# These are the direct/CLI defaults; /generate uses [float.request] below.
a_cfg_scale = 2.0
e_cfg_scale = 1.0
r_cfg_scale = 1.0

[float.diffusion]
# Ablation path; sample/cosine is the production configuration.
n_diff_steps = 100
diff_schedule = "cosine"
diffusion_mode = "sample"

[float.request]
# Defaults POST /generate uses when the client omits a field. A value in the
# request body always wins. Keep nfe in 5..25. These are intentionally separate
# from [float.ode]/[float.guidance] so the HTTP API can use a different budget;
# keep them aligned if you want one sampling/guidance configuration.
nfe = 10
seed = 25
emotion = "S2E"
a_cfg_scale = 2.0
r_cfg_scale = 1.0
e_cfg_scale = 1.0
no_crop = false
decode_batch_size = 0

[ipc]
enabled = true
zmq_control_endpoint = "tcp://127.0.0.1:5555"
zmq_frames_endpoint = "tcp://127.0.0.1:5556"
shm_name = "float_frame_ring"
shm_ring_size = 64
