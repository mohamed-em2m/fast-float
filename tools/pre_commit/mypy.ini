# mypy configuration used by the pre-commit hook (via
# `--config-file=tools/pre_commit/mypy.ini`). Mirrors the lenient settings in
# pyproject.toml: this repo is largely untyped, so the hook flags issues in
# annotated code without demanding annotations everywhere.
[mypy]
python_version = 3.10
ignore_missing_imports = true
follow_imports = silent
check_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
warn_redundant_casts = false
warn_unused_ignores = false
