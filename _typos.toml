# typos (crate-ci/typos) configuration.
# Allowlist legitimate project identifiers that the dictionary flags as typos.
[default.extend-words]
# wav2vec2_ser.py / speech-emotion-recognition acronym
ser = "ser"
# rust_model.ot -> legacy PyTorch/HF weight filename extension
ot = "ot"
# CC BY-NC-ND license acronym (No-Derivatives)
ND = "ND"
# secerts.toml — historical name of the machine-local secrets file
# (intentionally "secerts", used across config, docs and tooling)
secerts = "secerts"

[default.extend-identifiers]
ser = "ser"
"rust_model.ot" = "rust_model.ot"
ND = "ND"
secerts = "secerts"
