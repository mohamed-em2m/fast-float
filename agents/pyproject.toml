[project]
name = "float-gemini-agent"
version = "0.1.0"
description = "LiveKit Agents voice worker for FLOAT, backed by the Gemini Live API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Realtime speech-to-speech + function calling. Kept in its own project:
    # livekit-agents needs numpy>=2 / pydantic>=2.9 / websockets>=16, which
    # conflict with FLOAT's pinned inference stack, so this worker runs as a
    # separate process and talks to FLOAT over LiveKit DataStream.
    "livekit-agents[google]>=1.8,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
float-gemini = "float_agent.agent:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"
line-length = 120
