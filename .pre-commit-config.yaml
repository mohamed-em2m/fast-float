default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # Python linting & formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning (Gitleaks works on Windows)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"

  # Validate pyproject
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        name: "🐍 python · Validate pyproject.toml"
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  # Pre-commit builtin hooks (adjusted for Windows filesystem)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
        name: "📁 filesystem/📝 names · Check case sensitivity"
      - id: check-illegal-windows-names
        name: "📁 filesystem/📝 names · Validate Windows filenames"
      - id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
      - id: forbid-new-submodules
        name: "🌳 git · Prevent submodule creation"
      - id: check-added-large-files
        name: "🌳 git · Block large file commits"
        args: ["--maxkb=6000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        name: "📁 filesystem · Enforce LF line endings"
        args: ["--fix=lf"]
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      # NOTE: The following two hooks fail frequently on Windows due to
      # lack of POSIX chmod support and symlink checkout behavior.
      # Enable them only if you run inside WSL or configure git `core.symlinks=true`:
      # - id: check-shebang-scripts-are-executable
      # - id: check-executables-have-shebangs
      # - id: check-symlinks
      # - id: destroyed-symlinks

  # Commit message enforcement
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        name: "🌳 git · Validate commit message"
        stages: [commit-msg]
        additional_dependencies: [cz-conventional-gitmoji]

  # Spelling / typos (pre-built Windows binaries included in wheel)
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude]

  # Markdown linting and auto-fix
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--config, tools/pre_commit/.markdownlint.yaml, --fix]

  # Shell script linting (shellcheck-py provides Windows binaries)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args:
          [
            "-s",
            "bash",
            "--format=gcc",
            "--rcfile=tools/pre_commit/.shellcheckrc",
          ]

  # C++/CUDA formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        exclude: "vllm/third_party/.*"
        types_or: [c++, cuda]
        args: [--style=file, --verbose]

  # Typing (mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        name: "🐍 typing · mypy (optional)"
        args: ["--config-file=tools/pre_commit/mypy.ini"]
        stages: [manual]

  # uv-pre-commit (uv is natively compiled for Windows)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: pip-compile
        name: pip-compile
        args:
          [
            "requirements/test/cuda.in",
            "-c",
            "requirements/cuda.txt",
            "-o",
            "requirements/test/cuda.txt",
          ]
        files: ^requirements/(common|cuda|test/cuda)\.(in|txt)$

  # Local project hooks
  - repo: local
    hooks:
      # Cross-platform Python sign-off (replaces the bash/grep script)
      - id: signoff-commit
        name: "Sign-off Commit"
        entry: python -c
        args:
          - |
            import sys, subprocess
            try:
                name = subprocess.check_output(["git", "config", "user.name"], text=True).strip()
                email = subprocess.check_output(["git", "config", "user.email"], text=True).strip()
            except Exception:
                sys.exit(0)
            signoff = f"Signed-off-by: {name} <{email}>"
            commit_file = sys.argv[1]
            with open(commit_file, "r+", encoding="utf-8") as f:
                content = f.read()
                if signoff not in content:
                    f.seek(0, 2)
                    if content and not content.endswith("\n"):
                        f.write("\n")
                    f.write(f"\n{signoff}\n")
        language: python
        stages: [commit-msg]
