[project]
name = "fast-float"
version = "0.1.0"
description = "FLOAT audio-driven talking-face generation: fast inference API plus Gradio batch and live apps"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Core Deep Learning - PyTorch Stack (CUDA 12.6 wheels, see [tool.uv.sources])
    # torch >= 2.5.1 is required: the dynamo ONNX exporter used by
    # fast_float/onnx/export.py needs torch.export.export + a
    # torch.onnx.export() that accepts an ExportedProgram and `external_data`
    # (added in 2.5.1). cu126 matches onnxruntime-gpu 1.23's CUDA 12 sonames.
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    # Core Dependencies
    "numpy==1.24.4",
    # Transformers & NLP
    "transformers==4.30.2",
    # Computer Vision
    "opencv-python==4.8.0.74",
    "timm==1.0.9",
    "face-alignment==1.4.1",
    # Image Augmentation
    "albumentations==1.4.15",
    "albucore==0.0.16",
    # Audio Processing
    "librosa==0.10.1",
    "pydub>=0.25.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    # ONNX Runtime for the S2E emotion classifier (CPU works everywhere;
    # swap for onnxruntime-gpu on CUDA boxes for GPU acceleration)
    # <1.24: 1.24+ ships no cp310 wheels AND needs CUDA 13 (this box is
    # cp310; the GPU box is CUDA 12 — 1.22/1.23 serve both).
    # Video Processing
    "av==14.0.0",
    "torchdiffeq==0.2.5",
    "aiortc==1.13.0",
    # Data Processing & Visualization
    "pandas==2.0.3",
    "hf_transfer>=0.1.9",
    "matplotlib==3.7.2",
    "flow-vis==0.1",
    "pyyaml==6.0.1",
    "tqdm==4.65.0",
    "gdown==5.2.0",
    "setuptools==80.10.2",
    # Web Interface - Gradio (float_live_app.py needs >=4.40 for gr.Timer + streaming mic)
    "gradio==4.44.1",
    "soundfile>=0.12.1",
    # Web API
    "fastapi==0.122.0",
    "hypercorn==0.15.0",
    "uvicorn==0.24.0",
    # Async performance (no Windows wheels)
    "uvloop==0.19.0; sys_platform != 'win32'",
    # WebSocket support
    "websockets>=10.0,<12.0",
    # HTTP client
    "httpx==0.25.1",
    # Pydantic for data validation
    "pydantic==2.7.0",
    "pydantic-settings==2.1.0",
    "matplotlib-inline==0.1.7",
    "ipython==8.36.0",
    "huggingface-hub[hf-transfer]>=0.14.1,<1.0",
    "ngrok==1.4.0",
    "pyngrok==7.5.0",
    "brotli==1.2.0",
    "nest-asyncio==1.6.0",
    "nvidia-cuda-runtime>=13.4.92",
    "nvidia-cuda-nvrtc>=13.4.92",
    # ONNX runtime support (pinned onnxruntime<1.24 for cp310, and onnx<1.17 for numpy 1.x compatibility)
    # NOTE: this is the *portable* stack only -- the ONNX *conversion* stack
    # (onnxscript + onnx 1.17/1.18 + onnxruntime-gpu) is installed on demand by
    # scripts/convert_to_onnx.sh, because ORT 1.23 caps model IR at 11 and
    # onnxscript needs onnx>=1.17 (see AGENT.md §6).
    # NOTE: onnxruntime 1.23 is built against TensorRT 10.9 (dlopens libnvinfer.so.10);
    # a TRT 11 install (tensorrt-cu13, libnvinfer.so.11) cannot be loaded -> use
    # `tensorrt-cu12==10.9.*` on CUDA-12 boxes and keep the two pins in lockstep.
    "onnx>=1.16.0,<1.17",
    "onnxruntime>=1.19.0,<1.24",
    "pre-commit>=4.6.2",
]

[dependency-groups]
dev = ["pytest>=8.0,<9"]
# LiveKit transport (optional).
#   uv sync --group livekit
# The API process only needs the token API, which is numpy-free and installs
# cleanly here. The RTC SDK (`livekit`) requires numpy>=1.26 and CANNOT live
# in this environment: numpy is pinned to 1.24.4 for onnx<1.17. The avatar
# worker therefore gets its own project (see docs/LIVEKIT_INTEGRATION.md).
livekit = ["livekit-api>=1.2"]

# Flat scripts layout (no installable package) — manage the env only.
[tool.uv]
package = false

# CUDA 12.6 PyTorch wheels instead of the default PyPI (CUDA-bundled) ones.
# cu126 (not cu118) so torch and onnxruntime-gpu 1.23 — which dlopens CUDA 12
# sonames — share one CUDA major; cu118 torch would drag in nvidia-*-cu11 wheels
# whose cudnn/curand/cusolver/cusparse sonames clash with the cu12 ones.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.setuptools.packages.find]
where = ["."]
include = ["fast_float*"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",      # Import placement and related errors
    "E7",      # Statement errors
    "E9",      # Runtime-related errors
    "F",       # Pyflakes: undefined names, unused imports
    "B",       # Likely bugs
    "I",       # Import sorting
    "UP",      # Modern Python
    "RUF",     # Ruff-specific checks
    "SIM",     # Simplifiable patterns
    "ISC",     # Implicit string concatenation
    "ASYNC",   # Async mistakes
    "PERF",    # Potential performance issues
    "G",       # Logging format
    "LOG",     # Logging practices
    "PT",      # Pytest best practices
    "PLC0415", # Imports outside top-level
    "PLE",

]

ignore = [
    "E501", # Formatter handles most line-length issues
    "G004", # f-string logging is the house style here
    "PLC0415", # intentional lazy imports for optional/heavy deps (torch, onnxruntime, ...)
    "ASYNC240", # trivial local os.path checks inside FastAPI handlers
    "ASYNC230", # trivial local open() inside FastAPI handlers
    "E402", # modules configure env / sys.path before importing
    "B008", # FastAPI/Gradio dependency-injection idiom (Depends, gr.Progress)
    "PERF203", # per-item error isolation inside loops
    "RUF001", # ambiguous unicode (x, info glyph) intentional in user-facing text
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true

disallow_any_generics = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",    # If docstring rules are added later
    "F841",
]
